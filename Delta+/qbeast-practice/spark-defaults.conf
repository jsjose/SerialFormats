# Delta Lake + Qbeast (versiones fijadas según Dependencies.scala de qbeast-spark v0.7.1)
spark.jars.packages=io.delta:delta-spark_2.12:3.1.0,io.qbeast:qbeast-spark_2.12:0.7.1
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension,io.qbeast.spark.internal.QbeastSparkSessionExtension
spark.sql.catalog.spark_catalog=io.qbeast.spark.internal.sources.catalog.QbeastCatalog

# El default de Spark (1g) no aguanta datasets de varios millones de filas cacheados en memoria
spark.driver.memory=8g
